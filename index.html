<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>8-Max NLHE · 职业级剥削策略</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overflow-x: hidden; }
  body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #0b0b0b; color: #eee; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 8px; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  h1 { font-size: 16px; color: #d4af37; margin: 4px 0 8px; letter-spacing: 2px; text-align: center; }

  .key-bar { display: flex; gap: 6px; align-items: center; justify-content: center; background: #1a1a2e; border: 1px solid #7c3aed; border-radius: 10px; padding: 8px 10px; margin: 4px 0; width: 100%; max-width: 900px; flex-wrap: wrap; }
  .key-bar input { flex: 1; min-width: 180px; background: #0e0e0e; border: 1px solid #444; color: #eee; border-radius: 6px; padding: 10px 12px; font-size: 14px; outline: none; font-family: monospace; }
  .key-bar input:focus { border-color: #7c3aed; }
  #keyStatus { width: 100%; text-align: center; font-size: 12px; color: #a78bfa; margin-top: 4px; min-height: 14px; }

  .btn-gold { background: #d4af37; color: #000; border: none; padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; min-height: 40px; }
  .btn-gold:active { filter: brightness(0.9); }
  .btn-ai { background: #7c3aed; color: #fff; border: none; padding: 14px 24px; border-radius: 10px; font-size: 16px; font-weight: 800; cursor: pointer; min-height: 48px; width: 100%; max-width: 400px; }
  .btn-ai:active { filter: brightness(0.9); }
  .btn-ai:disabled { opacity: .5; cursor: not-allowed; }
  .btn-red { background: #c62828; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 700; min-height: 44px; }

  .auto-switch { display:flex; align-items:center; gap:6px; background:#0e0e0e; border:1px solid #444; border-radius:8px; padding:8px 12px; cursor:pointer; min-height:40px; }
  .auto-switch.on { border-color:#10b981; }
  .auto-switch .dot { width:10px; height:10px; border-radius:50%; background:#444; }
  .auto-switch.on .dot { background:#10b981; box-shadow:0 0 8px #10b981; }
  .auto-switch .txt { font-size:12px; color:#aaa; font-weight:700; }
  .auto-switch.on .txt { color:#10b981; }

  .opp-drawer-btn { position: fixed; top: 10px; right: 10px; z-index: 500; background: #d4af37; color: #000; border: none; padding: 10px 14px; border-radius: 10px; font-size: 13px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.5); min-height: 44px; }
  .opp-drawer { position: fixed; top: 0; right: -100%; width: 90%; max-width: 500px; height: 100vh; background: #0e0e0e; border-left: 2px solid #d4af37; z-index: 600; transition: right .3s; overflow-y: auto; padding: 16px; }
  .opp-drawer.open { right: 0; }
  .opp-drawer-close { position: sticky; top: 0; float: right; background: #c62828; color: #fff; border: none; padding: 10px 14px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; min-height: 44px; z-index: 10; }
  .opp-type-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
  .opp-type-card { background: #101010; border: 1px solid #333; border-radius: 10px; padding: 10px; }
  .opp-type-card.opp-card-inactive { opacity: .35; }
  .opp-card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .opp-seat-name { font-size: 13px; font-weight: 800; color: #d4af37; }
  .opp-role-name { font-size: 11px; color: #999; background: #1f1f1f; border: 1px solid #333; padding: 1px 7px; border-radius: 4px; }
  .opp-type-badge { display: inline-block; padding: 2px 9px; border-radius: 4px; font-weight: 800; font-size: 11px; }
  .opp-type-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .type-tag { font-size: 12px; padding: 6px 12px; border-radius: 14px; border: 1px solid; cursor: pointer; background: #171717; font-weight: 600; min-height: 32px; display: inline-flex; align-items: center; }
  .type-tag.selected { font-weight: 900; }
  .opp-card-tip { font-size: 11px; color: #ff8c42; line-height: 1.45; background: rgba(255,140,66,.07); padding: 6px 9px; border-left: 2px solid #ff8c42; border-radius: 4px; }
  .opp-data-toolbar { display: flex; gap: 6px; margin: 10px 0; flex-wrap: wrap; }
  .opp-data-toolbar .btn-gold { font-size: 11px; padding: 8px 10px; }
  .opp-table-wrap { display: none; margin-top: 12px; overflow-x: auto; border-top: 1px dashed #333; padding-top: 12px; }
  .opp-table-wrap.open { display: block; }
  .opp-table { min-width: 1200px; border-collapse: collapse; font-size: 11px; }
  .opp-table th { background: #1f1f1f; color: #aaa; padding: 5px 3px; text-align: center; border: 1px solid #333; }
  .opp-table td { padding: 3px 2px; text-align: center; border: 1px solid #2a2a2a; }
  .opp-table input { width: 42px; background: #0e0e0e; border: 1px solid #444; color: #eee; border-radius: 3px; padding: 4px 2px; font-size: 11px; text-align: center; }
  .opp-tip { font-size: 10px; color: #b8b8b8; text-align: left; padding-left: 6px; max-width: 240px; white-space: normal; }

  .table-scale-wrap { width: 100%; display: flex; justify-content: center; align-items: flex-start; overflow: hidden; margin: 4px 0; }
  .table-wrap { position: relative; width: 860px; height: 540px; flex-shrink: 0; transform-origin: top center; }
  .pt { width: 100%; height: 100%; border-radius: 250px; background: radial-gradient(ellipse at center, #1a7a52 0%, #0f5c3a 50%, #093d26 100%); border: 16px solid #3b2214; box-shadow: 0 0 0 5px #1a0e06, 0 12px 50px rgba(0,0,0,.9), inset 0 0 100px rgba(0,0,0,.5); position: relative; }
  .table-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: rgba(255,255,255,.05); font-size: 26px; font-weight: 900; letter-spacing: 6px; pointer-events: none; }
  .seat { position: absolute; width: 68px; height: 68px; border-radius: 50%; background: linear-gradient(145deg, #2a2a2a, #1a1a1a); border: 3px solid #555; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; z-index: 5; }
  .seat .seat-name { font-size: 11px; font-weight: 800; color: #ccc; }
  .seat .seat-role { font-size: 9px; color: #888; margin-top: 1px; }
  .seat .seat-cards { position: absolute; bottom: -30px; left: 50%; transform: translateX(-50%); display: flex; gap: 3px; z-index: 6; }
  .seat .seat-label { position: absolute; top: -22px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 700; white-space: nowrap; padding: 2px 6px; border-radius: 3px; background: rgba(0,0,0,.85); border: 1px solid #555; display: none; }
  .seat.my-seat { border-color: #d4af37; box-shadow: 0 0 12px rgba(212,175,55,.4); }
  .seat.active-seat { border-color: #4fc3f7; box-shadow: 0 0 20px rgba(79,195,247,.6); animation: pulse 1s infinite; }
  .seat.folded { opacity: .3; filter: grayscale(1); }
  .seat.inactive-seat { opacity: .35; filter: grayscale(1); }
  .seat .seat-toggle { position: absolute; top: -14px; right: -14px; width: 22px; height: 22px; border-radius: 50%; background: #444; border: 1px solid #888; color: #fff; font-size: 11px; line-height: 18px; text-align: center; cursor: pointer; }
  .seat .seat-stack-input { width: 50px; height: 16px; margin-top: 2px; background: #0e0e0e; border: 1px solid #444; color: #ffd54f; border-radius: 3px; padding: 0 2px; font-size: 10px; font-weight: 800; text-align: center; outline: none; -moz-appearance: textfield; }
  .seat .seat-stack-input::-webkit-outer-spin-button, .seat .seat-stack-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .seat.folded .seat-stack-input { color: #777; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 20px rgba(79,195,247,.6); } 50% { box-shadow: 0 0 30px rgba(79,195,247,.9); } }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
  .pos-0 { bottom: 22px; left: 50%; transform: translateX(-50%); }
  .pos-1 { bottom: 22px; left: 120px; }
  .pos-2 { top: 234px; left: 35px; }
  .pos-3 { top: 80px; left: 120px; }
  .pos-4 { top: 22px; left: 50%; transform: translateX(-50%); }
  .pos-5 { top: 80px; right: 120px; }
  .pos-6 { top: 234px; right: 35px; }
  .pos-7 { bottom: 22px; right: 120px; }
  .center-area { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; width: 400px; z-index: 1; }
  .pot-display { font-size: 15px; font-weight: 700; color: #ffd54f; margin-bottom: 5px; }
  .community-cards { display: flex; justify-content: center; gap: 5px; min-height: 60px; margin-bottom: 6px; }
  .street-label { font-size: 12px; color: rgba(255,255,255,.55); margin-bottom: 3px; }
  .action-panel { position: absolute; z-index: 20; background: linear-gradient(135deg, #1a1a2e, #141428); border: 2px solid #4fc3f7; border-radius: 12px; padding: 14px 16px; min-width: 340px; max-width: 460px; box-shadow: 0 8px 30px rgba(0,0,0,.8); display: none; top: 42%; left: 50%; transform: translate(-50%,-50%); }
  .action-panel.my-turn { border-color: #d4af37 !important; }
  .ap-title { font-size: 14px; font-weight: 800; color: #4fc3f7; margin-bottom: 4px; text-align: center; }
  .ap-info { font-size: 11px; color: #aaa; margin-bottom: 8px; text-align: center; line-height: 1.5; }
  .ap-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 6px; }
  .btn { padding: 12px 4px; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; text-align: center; min-height: 44px; }
  .btn:active { filter: brightness(0.9); }
  .btn-fold { background: #b71c1c; color: #fff; }
  .btn-check { background: #455a64; color: #fff; }
  .btn-call { background: #1565c0; color: #fff; }
  .btn-raise { background: #2e7d32; color: #fff; }
  .btn-allin { background: #f9a825; color: #000; }
  .raise-area { display: none; margin-top: 6px; padding-top: 8px; border-top: 1px solid #333; }
  .raise-presets { display: flex; gap: 4px; margin-bottom: 6px; flex-wrap: wrap; }
  .raise-preset-btn { flex: 1; min-width: 62px; padding: 8px 4px; border: 1px solid #444; border-radius: 6px; background: #222; color: #66bb6a; font-size: 11px; font-weight: 700; cursor: pointer; min-height: 40px; }
  .raise-input-row { display: flex; gap: 6px; align-items: center; }
  .raise-input { flex: 1; padding: 10px 8px; border: 1px solid #555; border-radius: 6px; background: #1a1a1a; color: #66bb6a; font-size: 15px; font-weight: 700; text-align: center; outline: none; }
  .raise-confirm { padding: 10px 16px; border: none; border-radius: 6px; background: #2e7d32; color: #fff; font-size: 14px; font-weight: 700; min-height: 44px; }

  .poker-card { width: 40px; height: 58px; background: linear-gradient(145deg, #1a1a1a, #2d2d2d); border-radius: 6px; border: 1px solid #555; position: relative; display: inline-flex; justify-content: center; align-items: center; box-shadow: 2px 3px 8px rgba(0,0,0,.7); flex-shrink: 0; }
  .poker-card .card-corner { position: absolute; font-size: 11px; font-weight: 900; line-height: 1; }
  .poker-card .corner-tl { top: 3px; left: 4px; text-align: center; }
  .poker-card .corner-br { bottom: 3px; right: 4px; text-align: center; transform: rotate(180deg); }
  .poker-card .card-rank { display: block; font-size: 10px; color: #fff; }
  .poker-card .card-suit { display: block; font-size: 8px; color: #ddd; }
  .poker-card .card-center { font-size: 20px; color: #fff; }
  .poker-card.red .card-rank, .poker-card.red .card-suit, .poker-card.red .card-center { color: #ff6b6b; }
  .poker-card.blk .card-rank, .poker-card.blk .card-suit, .poker-card.blk .card-center { color: #f0f0f0; }
  .poker-card.mini { width: 32px; height: 46px; }
  .poker-card.mini .card-rank { font-size: 9px; } .poker-card.mini .card-suit { font-size: 7px; } .poker-card.mini .card-center { font-size: 16px; }
  .poker-card.back { background: rgba(20,20,20,.6); border: 2px dashed rgba(255,255,255,.2); }
  .poker-card.back::after { content: '?'; color: rgba(255,255,255,.3); font-size: 14px; }

  .setup-bar { display: flex; gap: 6px; align-items: center; justify-content: center; background: #161616; border: 1px solid #333; border-radius: 10px; padding: 8px; margin: 6px 0; width: 100%; max-width: 900px; flex-wrap: wrap; }
  .setup-item { display: flex; align-items: center; gap: 4px; }
  .setup-item label { font-size: 11px; color: #aaa; }
  .setup-item select, .setup-item input { background: #0e0e0e; border: 1px solid #444; color: #eee; border-radius: 5px; padding: 8px 6px; font-size: 12px; width: 64px; text-align: center; outline: none; min-height: 40px; }
  .setup-item select { width: 100px; }

  .ai-advice { margin-top: 8px; width: 100%; max-width: 900px; background: linear-gradient(135deg, #1a1a2e, #141428); border: 2px solid #7c3aed; border-radius: 10px; padding: 12px 16px; display: none; }
  .ai-advice-title { font-size: 13px; font-weight: 800; color: #a78bfa; margin-bottom: 8px; display:flex; justify-content:space-between; align-items:center; flex-wrap: wrap; gap: 6px; }
  .ai-advice-title .live-dot { font-size:10px; color:#10b981; font-weight:600; display:none; }
  .ai-advice-title .live-dot.on { display:inline-block; }
  .ai-advice-title .timer { font-size: 11px; color: #888; font-weight: 400; }
  .ai-advice-content { font-size: 22px; line-height: 1.5; color: #d4af37; white-space: pre-wrap; font-weight: 900; text-align: center; }
  .math-info { font-size: 11px; color: #888; margin-top: 8px; text-align: center; line-height: 1.6; }

  .btn-row { display: flex; gap: 8px; justify-content: center; margin: 8px 0; flex-wrap: wrap; align-items:center; width: 100%; }
  .action-log { margin-top: 8px; max-height: 120px; overflow-y: auto; background: #111; border-radius: 8px; padding: 8px 12px; font-size: 12px; line-height: 1.8; border: 1px solid #222; display: none; width: 100%; max-width: 900px; }
  .log-fold { color: #3b82f6; } .log-call { color: #f59e0b; } .log-raise { color: #ef4444; } .log-check { color: #10b981; } .log-info { color: #888; }

  .picker-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.95); z-index: 1000; display: none; flex-direction: column; padding: 12px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .picker-modal.open { display: flex; }
  .picker-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 4px 14px; position: sticky; top: 0; background: rgba(0,0,0,.95); z-index: 2; }
  .picker-title { font-size: 18px; font-weight: 800; color: #d4af37; }
  .picker-close { background: #c62828; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: 700; min-height: 44px; }
  .picker-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding-bottom: 30px; }
  .picker-suit-col { display: flex; flex-direction: column; gap: 6px; }
  .picker-suit-header { text-align: center; font-size: 30px; font-weight: 800; padding: 6px 0; border-bottom: 2px solid #444; margin-bottom: 6px; }
  .picker-suit-header.red { color: #e53935; } .picker-suit-header.blk { color: #eee; }
  .picker-card-btn { width: 100%; padding: 14px 0; background: #2a2a2a; border: 2px solid #444; border-radius: 10px; font-size: 22px; font-weight: 800; cursor: pointer; text-align: center; line-height: 1; min-height: 56px; }
  .picker-card-btn.red { color: #e53935; } .picker-card-btn.blk { color: #eee; }
  .picker-card-btn:active:not(:disabled) { background: #3a3a3a; border-color: #d4af37; }
  .picker-card-btn:disabled { background: #111; cursor: not-allowed; opacity: 0.3; }
  .picker-card-btn.selected { border-color: #4fc3f7; box-shadow: 0 0 12px rgba(79,195,247,.6); }

  .waiting-overlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 2000; background: linear-gradient(135deg, #1a1a2e, #141428); border: 3px solid #d4af37; border-radius: 14px; padding: 24px 32px; text-align: center; box-shadow: 0 0 40px rgba(212,175,55,.5); display: none; max-width: 90vw; }
  .waiting-overlay .wo-title { font-size: 20px; font-weight: 900; color: #d4af37; margin-bottom: 10px; }
  .waiting-overlay .wo-sub { font-size: 13px; color: #ccc; }

  @media (max-width: 950px) {
    body { padding: 6px; }
    h1 { font-size: 14px; }
    .key-bar { padding: 6px 8px; }
    .key-bar input { font-size: 13px; padding: 8px 10px; min-width: 150px; }
    .btn-gold { padding: 8px 12px; font-size: 12px; }
    .setup-bar { padding: 6px; }
    .setup-item select, .setup-item input { font-size: 11px; padding: 6px 4px; width: 58px; }
    .ai-advice-content { font-size: 20px; }
    .picker-card-btn { font-size: 20px; padding: 12px 0; min-height: 50px; }
  }
  @media (max-width: 700px) {
    .key-bar { flex-direction: column; align-items: stretch; }
    .key-bar input { min-width: 100%; }
    .setup-bar { gap: 4px; }
    .ai-advice-content { font-size: 18px; }
  }
  @media (orientation: landscape) and (max-width: 1100px) {
    h1 { font-size: 13px; margin: 2px 0 4px; }
    .key-bar { margin: 2px 0; padding: 5px 8px; }
    .setup-bar { margin: 3px 0; padding: 5px 8px; }
    .ai-advice-content { font-size: 20px; }
  }
</style>
</head>
<body>

<h1>♦ 8-Max NLHE · 职业级剥削策略 ♠</h1>

<button class="opp-drawer-btn" onclick="toggleOppDrawer()">📊 对手</button>

<div class="key-bar">
  <input type="text" id="apiKeyInput" placeholder="sk-... DeepSeek API Key">
  <button class="btn-gold" onclick="saveApiKey()">保存</button>
  <button class="btn-gold" onclick="testApi()">测试</button>
  <div class="auto-switch on" id="autoAdviceSwitch" onclick="toggleAutoAdvice()">
    <span class="dot"></span>
    <span class="txt">自动建议：开</span>
  </div>
  <div id="keyStatus"></div>
</div>

<div class="setup-bar">
  <div class="setup-item">
    <label>庄位</label>
    <select id="dealerSelect" onchange="onDealerChange(this.value)">
      <option value="">— 选择 —</option>
      <option value="0">座位0（我）</option><option value="1">座位1</option><option value="2">座位2</option>
      <option value="3">座位3</option><option value="4">座位4</option><option value="5">座位5</option>
      <option value="6">座位6</option><option value="7">座位7</option>
    </select>
  </div>
  <div class="setup-item"><label>筹码</label><input type="number" id="chipInput" value="40" min="10" step="5"></div>
  <div class="setup-item"><label>小盲</label><input type="number" id="sbInput" value="0.5" min="0" step="0.5"></div>
  <div class="setup-item"><label>大盲</label><input type="number" id="bbInput" value="1" min="0" step="0.5"></div>
  <div class="setup-item"><label>抓头</label><input type="number" id="straddleInput" value="0" min="0" step="0.5"></div>
  <div class="setup-item"><label>底注</label><input type="number" id="anteInput" value="0" min="0" step="0.5"></div>
  <button class="btn-gold" onclick="startNewHand()">开始</button>
  <button class="btn-gold" onclick="rotateAndStart()">换庄</button>
</div>

<div class="table-scale-wrap">
  <div class="table-wrap" id="tableWrap">
    <div class="pt">
      <div class="table-text">8-MAX NLHE</div>
      <div class="seat pos-0" id="seat-0" onclick="clickSeat(0)">
        <span class="seat-name">玩家</span><span class="seat-role" id="role-0">—</span>
        <input type="number" class="seat-stack-input" id="stackInput-0" value="40" step="0.5" min="0"
               onclick="event.stopPropagation()" onchange="onStackInputChange(0,this.value)">
        <div class="seat-cards" id="cards-0"></div><div class="seat-label" id="label-0"></div>
      </div>
      <div class="seat pos-1" id="seat-1" onclick="clickSeat(1)">
        <span class="seat-name">座位1</span><span class="seat-role" id="role-1">—</span>
        <input type="number" class="seat-stack-input" id="stackInput-1" value="40" step="0.5" min="0"
               onclick="event.stopPropagation()" onchange="onStackInputChange(1,this.value)">
        <div class="seat-cards" id="cards-1"></div><div class="seat-label" id="label-1"></div>
        <div class="seat-toggle" onclick="toggleSeatActive(1)">✕</div>
      </div>
      <div class="seat pos-2" id="seat-2" onclick="clickSeat(2)">
        <span class="seat-name">座位2</span><span class="seat-role" id="role-2">—</span>
        <input type="number" class="seat-stack-input" id="stackInput-2" value="40" step="0.5" min="0"
               onclick="event.stopPropagation()" onchange="onStackInputChange(2,this.value)">
        <div class="seat-cards" id="cards-2"></div><div class="seat-label" id="label-2"></div>
        <div class="seat-toggle" onclick="toggleSeatActive(2)">✕</div>

/* ==================================================================
   牌力评估 + 蒙特卡洛（前端本地计算）
   ================================================================== */
const RANK_VAL = {A:14,K:13,Q:12,J:11,T:10,'9':9,'8':8,'7':7,'6':6,'5':5,'4':4,'3':3,'2':2};
const CAT_NAMES = ['高牌','一对','两对','三条','顺子','同花','葫芦','四条','同花顺'];

function eval5(cards){
  const vals = cards.map(c=>RANK_VAL[c.rank]).sort((a,b)=>b-a);
  const suits = cards.map(c=>c.suit);
  const flush = suits.every(s=>s===suits[0]);
  const counts = {};
  vals.forEach(v=>counts[v]=(counts[v]||0)+1);
  const groups = Object.keys(counts).map(k=>[parseInt(k),counts[k]]).sort((a,b)=> b[1]-a[1] || b[0]-a[0]);
  const uniq = [...new Set(vals)].sort((a,b)=>b-a);
  let straightHigh = 0;
  if(uniq.length === 5){
    if(uniq[0]-uniq[4] === 4) straightHigh = uniq[0];
    else if(uniq[0]===14 && uniq[1]===5 && uniq[4]===2) straightHigh = 5;
  }
  if(flush && straightHigh) return [8, straightHigh];
  if(groups[0][1]===4) return [7, groups[0][0], groups[1][0]];
  if(groups[0][1]===3 && groups[1][1]===2) return [6, groups[0][0], groups[1][0]];
  if(flush) return [5, ...vals];
  if(straightHigh) return [4, straightHigh];
  if(groups[0][1]===3) return [3, groups[0][0], groups[1][0], groups[2][0]];
  if(groups[0][1]===2 && groups[1][1]===2) return [2, groups[0][0], groups[1][0], groups[2][0]];
  if(groups[0][1]===2) return [1, groups[0][0], groups[1][0], groups[2][0], groups[3][0]];
  return [0, ...vals];
}

const C75 = (() => {
  const res = [];
  for(let a=0;a<3;a++) for(let b=a+1;b<4;b++) for(let c=b+1;c<5;c++) for(let d=c+1;d<6;d++) for(let e=d+1;e<7;e++) res.push([a,b,c,d,e]);
  return res;
})();

function evaluate7(cards){
  if(!cards || cards.length < 5) return [-1];
  let best = null;
  for(const idx of C75){
    const k = eval5(idx.map(i=>cards[i]));
    if(!best || compareKeys(k, best) > 0) best = k;
  }
  return best || [-1];
}

function compareKeys(a, b){
  const n = Math.max(a.length, b.length);
  for(let i=0;i<n;i++){
    const x = a[i]||0, y = b[i]||0;
    if(x !== y) return x - y;
  }
  return 0;
}

/* ============ 前端蒙特卡洛胜率计算 ============ */
const FULL_DECK = [];
for(const s of ['s','h','d','c']) for(const r of ['A','K','Q','J','T','9','8','7','6','5','4','3','2']) FULL_DECK.push({rank:r, suit:s});

function monteCarloEquity(hero, board, numOpp, sims){
  // hero, board: [{rank, suit}]
  const usedKeys = new Set();
  hero.forEach(c=>usedKeys.add(c.rank+c.suit));
  board.forEach(c=>usedKeys.add(c.rank+c.suit));
  const avail = FULL_DECK.filter(c=>!usedKeys.has(c.rank+c.suit));

  let wins = 0, ties = 0;
  const totalSims = sims || 2000;
  const boardNeed = 5 - board.length;

  for(let i=0;i<totalSims;i++){
    // 洗牌（Fisher-Yates 仅部分）
    const pool = avail.slice();
    // 取需要数目的牌
    const needed = numOpp * 2 + boardNeed;
    for(let j=0;j<needed;j++){
      const k = j + Math.floor(Math.random() * (pool.length - j));
      [pool[j], pool[k]] = [pool[k], pool[j]];
    }
    const oppHands = [];
    let idx = 0;
    for(let o=0;o<numOpp;o++){
      oppHands.push([pool[idx], pool[idx+1]]); idx+=2;
    }
    const extraBoard = pool.slice(idx, idx + boardNeed);
    const fullBoard = board.concat(extraBoard);
    const myKey = evaluate7(hero.concat(fullBoard));
    let bestOppKey = null;
    let tieCount = 0;
    for(const oh of oppHands){
      const ok = evaluate7(oh.concat(fullBoard));
      if(!bestOppKey || compareKeys(ok, bestOppKey) > 0){
        bestOppKey = ok; tieCount = 1;
      } else if(compareKeys(ok, bestOppKey) === 0){
        tieCount++;
      }
    }
    if(!bestOppKey){ wins++; continue; }
    const cmp = compareKeys(myKey, bestOppKey);
    if(cmp > 0) wins++;
    else if(cmp === 0) ties++;
  }
  return ((wins + ties * 0.5) / totalSims) * 100;
}

function calcEquityLocal(hero, board, numOpp, pot, toCall){
  // hero/board 为 "As","Kh" 字符串
  const heroCards = hero.map(c=>({rank: c[0].toUpperCase()==='1'?'T':c[0].toUpperCase(), suit: c[1].toLowerCase()}));
  const boardCards = board.map(c=>({rank: c[0].toUpperCase()==='1'?'T':c[0].toUpperCase(), suit: c[1].toLowerCase()}));
  const sims = numOpp === 1 && board.length >= 3 ? 1500 : 2000;
  const equityPct = monteCarloEquity(heroCards, boardCards, numOpp, sims);
  const equity = equityPct / 100;
  const potOdds = (pot + toCall) > 0 ? toCall / (pot + toCall) : 0;
  const evCall = equity * pot - (1 - equity) * toCall;
  return {
    equity_pct: Math.round(equityPct * 10) / 10,
    pot_odds_pct: Math.round(potOdds * 1000) / 10,
    ev_call: Math.round(evCall * 100) / 100,
    method: 'local-monte-carlo'
  };
}

function takeFromStack(seatIdx, amount){
  const p = G.players[seatIdx];
  if(!p || !(amount > 0)) return;
  p.stack = Math.max(0, round1(p.stack - amount));
  G.stackBySeat[seatIdx] = p.stack;
  renderStack(seatIdx);
}
function awardPot(winners){
  if(!winners || winners.length === 0 || G.pot <= 0) return;
  const total = G.pot;
  const share = round1(total / winners.length);
  winners.forEach(s=>{
    const p = G.players[s];
    const cur = (p && p.stack !== undefined) ? p.stack : (G.stackBySeat[s] || 0);
    if(p) p.stack = round1(cur + share);
    G.stackBySeat[s] = (p ? p.stack : round1(cur + share));
    renderStack(s);
  });
  addLog('系统', `${winners.map(s=>SEAT_NAMES[s]).join('、')} 赢得底池 ${total.toFixed(1)} BB`, 'info');
  G.pot = 0;
  updateUI();

function drawCard(used){
  const deck = [];
  for(const s of SUITS) for(const r of RANKS) deck.push({rank:r, suit:s.k, sym:s.y, color:s.c});
  const avail = deck.filter(c => !used.has(c.rank + c.suit));
  if(avail.length === 0) return null;
  const c = avail[Math.floor(Math.random()*avail.length)];
  used.add(c.rank + c.suit);
  return c;
}
function dealMissingHands(){
  const used = new Set();
  (G.players[0] ? G.players[0].hand : []).forEach(c=>used.add(c.rank+c.suit));
  G.communityCards.forEach(c=>used.add(c.rank+c.suit));
  for(let i=1;i<8;i++){
    const p = G.players[i];
    if(!G.seatActive[i] || !p || p.folded) continue;
    if(p.hand && p.hand.length === 2){ p.hand.forEach(c=>used.add(c.rank+c.suit)); continue; }
    p.hand = [];
    for(let k=0;k<2;k++){ const c = drawCard(used); if(c) p.hand.push(c); }
  }
}

function nextActor(){

function showRaiseArea(seatIdx){
  const ra = document.getElementById('raiseArea');
  ra.style.display = 'block';
  const p = G.players[seatIdx];
  const minTotal = round1(G.currentBet === 0 ? G.bbSize : G.currentBet + G.lastRaiseSize);
  const maxTotal = round1(p.committed + p.stack);
  const callAmt  = Math.max(G.currentBet - p.committed, 0);
  const potNow   = G.pot;
  const remain   = p.stack;
  const inp = document.getElementById('raiseInput');
  const startVal = Math.min(Math.max(minTotal, G.bbSize), Math.max(maxTotal, minTotal));
  inp.value = startVal.toFixed(1);
  inp.min = minTotal;
  inp.max = maxTotal;
  document.getElementById('raiseMinMax').textContent =
    `最小 ${minTotal.toFixed(1)} BB ｜ 最大 ${maxTotal.toFixed(1)} BB ｜ 底池 ${potNow.toFixed(1)} BB`;
  const presets = document.getElementById('raisePresets');
  presets.innerHTML = '';
  const list = [];
  if (G.street === 'preflop') {
    [2.5, 3, 4, 5].forEach(m => {
      const v = round1(G.bbSize * m);
      if (v >= minTotal && v <= maxTotal) list.push({ label: v.toFixed(1) + ' BB', amt: v });
    });
  }
  [0.33, 0.5, 0.75, 1.0, 1.5].forEach(pc => {
    let amt;
    if (G.currentBet === 0) { amt = potNow * pc; }
    else { amt = G.currentBet + (potNow + callAmt) * pc; }
    amt = round1(amt);
    if (amt < minTotal) amt = minTotal;
    if (amt > maxTotal) amt = maxTotal;
    list.push({ label: Math.round(pc * 100) + '% · ' + amt.toFixed(1), amt: amt });
  });
  list.push({ label: '全下 ' + maxTotal.toFixed(1), amt: maxTotal });
  const seen = new Set();
  list.forEach(item => {
    const key = item.amt.toFixed(1);
    if (seen.has(key)) return;
    seen.add(key);
    const btn = document.createElement('button');
    btn.className = 'raise-preset-btn';
    btn.textContent = item.label;
    btn.onclick = () => { inp.value = item.amt.toFixed(1); };

  });

function confirmRaise(){ doAction(G.actorIdx,'raise'); }
function doAction(seatIdx,action){
  const p=G.players[seatIdx];
  const needToCall=Math.max(G.currentBet-p.committed, 0);
  document.getElementById('actionPanel').style.display='none';
  document.getElementById('raiseArea').style.display='none';
  document.querySelectorAll('.seat').forEach(el=>el.classList.remove('active-seat'));
  document.querySelectorAll('.seat-label').forEach(el=>{ el.style.display='none'; el.textContent=''; });
  G.actionHistory.push({seat:seatIdx,action:action,street:G.street,amount:null});
  trackOpponentAction(seatIdx, action);

  if(action==='raise'||action==='allin'){
    if(G.street==='preflop') G.preflopRaiser=seatIdx;
    G.lastAggressor=seatIdx;
    const maxTotal = round1(p.committed + p.stack);
    let amt;
    if(action==='allin'){ amt = maxTotal; }
    else {
      amt = parseFloat(document.getElementById('raiseInput').value);
      const minTotal = G.currentBet===0 ? G.bbSize : G.currentBet + G.lastRaiseSize;
      if(isNaN(amt) || amt < minTotal) amt = minTotal;
      if(amt > maxTotal) amt = maxTotal;
    }
    amt = round1(amt);
    const added = Math.max(round1(amt - p.committed), 0);
    takeFromStack(seatIdx, added);
    G.lastRaiseSize = Math.max(amt - G.currentBet, G.bbSize);
    p.committed = amt;
    G.pot = round1(G.pot + added);
    G.currentBet = amt;
    G.actionHistory[G.actionHistory.length-1].amount=amt;
    for(let i=0;i<8;i++) if(i!==seatIdx&&G.players[i]&&!G.players[i].folded) G.players[i].acted=false;
    G.actionsLeft=activeCount()-1;
    addLog(seatIdx,(action==='allin'?'全下 ':'加注到 ')+amt.toFixed(1)+' BB','raise'); p.acted=true;
  } else if(action==='fold'){
    p.folded=true; addLog(seatIdx,'弃牌','fold'); G.actionsLeft--; p.acted=true;
  } else if(action==='check'){
    addLog(seatIdx,'过牌','check'); G.actionsLeft--; p.acted=true;
  } else if(action==='call'){
    const pay = Math.min(needToCall, p.stack);
    takeFromStack(seatIdx, pay);
    p.committed = round1(p.committed + pay);
    G.pot = round1(G.pot + pay);
    addLog(seatIdx,`跟注 ${pay.toFixed(1)} BB`,'call'); G.actionsLeft--; p.acted=true;
  }
  updateUI(); G.actorIdx=(G.actorIdx+1)%8;
  if(activeCount()<=1){ G.actionsLeft=0; advanceStreet(); return; }
  nextActor();
}
function trackOpponentAction(seatIdx, action){
  if(seatIdx === 0) return;
  const t = G.autoTrack[seatIdx];
  if(!t) return;

function resolveShowdown(){
  dealMissingHands();
  revealAllHands();
  const contenders = [];
  for(let i=0;i<8;i++){
    const p = G.players[i];
    if(!G.seatActive[i] || !p || p.folded) continue;
    if(!p.hand || p.hand.length < 2) continue;
    const key = evaluate7([...p.hand, ...G.communityCards]);
    contenders.push({ seat:i, key });
  }
  if(contenders.length === 0) return;
  contenders.forEach(c=>{ addLog(c.seat, `牌型：${CAT_NAMES[c.key[0]] || '未知'}`, 'info'); });
  contenders.sort((a,b)=> compareKeys(b.key, a.key));
  const best = contenders[0].key;
  const winners = contenders.filter(c => compareKeys(c.key, best) === 0).map(c => c.seat);
  awardPot(winners);
}

function fetchPokerMath(){
  if (!G.players[0] || G.players[0].hand.length < 2) return null;
  const hero = G.players[0].hand.map(c => c.rank + c.suit);
  const board = G.communityCards.map(c => c.rank + c.suit);
  const toCall = Math.max(G.currentBet - G.players[0].committed, 0);
  const numOpp = activeCount() - 1;
  try {
    return calcEquityLocal(hero, board, Math.max(1, numOpp), G.pot, toCall);
  } catch(e) {
    console.warn('本地计算失败:', e);
    return null;
  }
}

    oppProfiles += `      剥削点：${info.tip}\n`;
  }
  if (!oppProfiles) oppProfiles = '  （未设置对手数据，按 GTO 基准）\n';

  const currentActor = G.roles[G.actorIdx] ? `座位${G.actorIdx}（${G.roles[G.actorIdx]}）` : '无';

function parseSSEBuffer(buffer, onDelta){
  const lines = buffer.split('\n');
  const tail = lines.pop() || '';
  for(const rawLine of lines){
    const line = rawLine.trim();
    if(!line || !line.startsWith('data:')) continue;
    const data = line.slice(5).trim();
    if(data === '[DONE]') continue;
    try{
      const json = JSON.parse(data);
      const delta = json.choices?.[0]?.delta?.content || '';
      if(delta) onDelta(delta);
    }catch(e){ }
  }
  return tail;
}

  const abortCtrl = new AbortController();
  const timeoutId = setTimeout(() => abortCtrl.abort('timeout'), 60000);

  try {
    // 直接调 DeepSeek（无需后端）
    const resp = await fetch('https://api.deepseek.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + key
      },
      body: JSON.stringify({
        model: 'deepseek-chat',
        messages: [
          { role: 'system', content: DEEPSEEK_SYSTEM_PROMPT },
          { role: 'user', content: fullPrompt }
        ],
        stream: true,
        temperature: 0.25,
        max_tokens: 300
      }),
      signal: abortCtrl.signal
    });

    if (!resp.ok) {
      clearTimeout(timeoutId); clearInterval(timerInterval);
      const t = await resp.text();
      let msg = `HTTP ${resp.status}`;
      if (resp.status === 401) msg += ' · Key 无效';
      else if (resp.status === 402) msg += ' · 余额不足';
      else if (resp.status === 429) msg += ' · 请求太频繁';
      if(mySeq === ADVICE_REQUEST_SEQ) showAdviceBox('❌ ' + msg, t.slice(0, 200));
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let sseBuf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      if(mySeq !== ADVICE_REQUEST_SEQ){ try{ reader.cancel(); }catch(e){} break; }
      sseBuf += decoder.decode(value, { stream: true });
      sseBuf = parseSSEBuffer(sseBuf, (delta) => {
        fullText += delta;
        if (firstChunk) {
          firstChunk = false;
          title.textContent = '🤖 DeepSeek 输出中...' + (manual ? '' : '（自动）');
        }
        content.innerHTML =
          '<div style="font-size:18px;color:#d4af37;font-weight:800;text-align:left;white-space:pre-wrap;line-height:1.6;">' +
          escapeHtml(fullText) +
          '<span style="animation:blink 1s infinite;color:#a78bfa;">▊</span></div>';
      });
    }
    clearTimeout(timeoutId); clearInterval(timerInterval);
    if(mySeq !== ADVICE_REQUEST_SEQ){ return; }

    const raw = fullText.trim() || '（无返回内容，请点击按钮重试）';
    const mAct = raw.match(/行动[:：]\s*([^\n]+)/);
    const actionLine = mAct ? mAct[1].trim() : raw.split('\n')[0];
    const mReason = raw.match(/理由[:：]\s*([\s\S]*?)(?=\n置信度[:：]|$)/);
    const mConf = raw.match(/置信度[:：]\s*(\d+)/);
    const reason = mReason ? mReason[1].trim() : '';
    const conf = mConf ? mConf[1] : '';

    const amtMatch = actionLine.match(/([\d.]+)\s*BB/i);
    if (amtMatch && (actionLine.includes('加注') || actionLine.includes('下注'))) {
      const inp = document.getElementById('raiseInput');
      if (inp) inp.value = parseFloat(amtMatch[1]);
    }

    let detail = reason;
    if (conf) detail += (detail ? '\n' : '') + '置信度：' + conf;
    if (timerEl) timerEl.textContent = ((Date.now() - startTime) / 1000).toFixed(1) + 's';
    showAdviceBox(actionLine, detail);
  } catch (e) {
    clearTimeout(timeoutId); clearInterval(timerInterval);
    if(mySeq !== ADVICE_REQUEST_SEQ) return;
    if (e && e.name === 'AbortError') {
      showAdviceBox('❌ 请求超时或被取消', '已收到部分内容：\n' + fullText);
    } else {
      showAdviceBox('❌ 请求异常', e.message);
    }
  } finally {
    if(mySeq === ADVICE_REQUEST_SEQ){
      if (liveDot) liveDot.classList.remove('on');
      if (btn) { btn.disabled = false; btn.textContent = '🤖 立即获取 DeepSeek 建议'; }
      AI_RUNNING = false;
    }
  }
}

function showAdviceBox(main, detail){
  const box = document.getElementById('aiAdvice');
  const title = document.getElementById('aiAdviceTitle');
  const content = document.getElementById('aiAdviceContent');
  box.style.display = 'block';
  title.textContent = '🤖 DeepSeek 职业级建议';
  box.style.borderColor = '#7c3aed';
  content.innerHTML =
    '<div style="font-size:22px;color:#d4af37;font-weight:900;text-align:center;">' + escapeHtml(main) + '</div>' +
    (detail ? '<div style="font-size:12px;color:#888;font-weight:400;margin-top:8px;white-space:pre-wrap;text-align:left;line-height:1.6;">' + escapeHtml(detail) + '</div>' : '');
}
